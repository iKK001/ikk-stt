name: ci
# Runs only by hand: Actions tab > ci > "Run workflow".
on:
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core build+test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo run -p ikk-cli -- about
      - run: cargo build --release -p ikk-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ikk-cli-${{ github.ref_name }}-windows
          path: target/release/ikk-cli.exe
          retention-days: 30

  app:
    name: reference app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/ikk_core_flutter
      - run: flutter analyze
        working-directory: apps/ikk_core_flutter
      - run: flutter pub get
        working-directory: apps/reference_app
      - run: flutter analyze
        working-directory: apps/reference_app
      - run: flutter build windows --release
        working-directory: apps/reference_app
      - uses: actions/upload-artifact@v4
        with:
          name: reference-app-${{ github.ref_name }}-windows
          path: apps/reference_app/build/windows/x64/runner/Release/
          retention-days: 30
