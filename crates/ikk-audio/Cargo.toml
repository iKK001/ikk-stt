[package]
name = "ikk-audio"
description = "Microphone capture, resampling, VAD, denoise, AGC (platform-neutral audio pipeline)"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
# Capture on all five targets (WASAPI, CoreAudio, ALSA/PipeWire, AAudio/oboe).
cpal = "0.18"
# RNNoise denoise, pure Rust, 48 kHz frames (resampled internally from 16 kHz).
nnnoiseless = { version = "0.5", default-features = false }
