[package]
name = "ikk-providers"
description = "Cloud STT adapters (Deepgram, Voiceitt, OpenAI, ElevenLabs) behind the ikk-stt Provider trait"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ikk-audio.workspace = true
ikk-stt.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
url = "2"
# Raw HTTP/WS, no vendor SDKs (AGPL-clean).
# TLS: pure-Rust `ring` provider + bundled Mozilla roots on every target. The
# default aws-lc provider needs a C cross toolchain (Android/Windows from macOS)
# and the platform verifier needs Java glue on Android — both avoided here.
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "multipart", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows' built-in recognizer (no key; Microsoft cloud dictation).
ikk-stt-windows.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["deepgram", "voiceitt", "openai", "elevenlabs"]
deepgram = []
voiceitt = []
openai = []
elevenlabs = []
