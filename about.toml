# cargo-about configuration: generates THIRD_PARTY.md, the third-party
# license list shown in the apps' Licenses screen.
#   cargo install cargo-about --features cli
#   cargo about generate about.hbs | tr -d "\r" > THIRD_PARTY.md
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BlueOak-1.0.0",
  "OpenSSL",
]
# Our own crates (all `publish = false`) are covered by LICENSE and NOTICE,
# not listed here.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
